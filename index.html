<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prime Legacy | Official</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: white;
}

header {
    background: #101010;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #f5c542;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
}

nav a:hover {
    color: #f5c542;
}

.hero {
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
    background:
        radial-gradient(circle at center, #3a2b08 0%, #111 35%, #080808 75%);
}

.hero h1 {
    font-size: 55px;
    color: #f5c542;
    margin-bottom: 12px;
}

.hero p {
    font-size: 18px;
    color: #ccc;
    margin-bottom: 28px;
}

.buttons a {
    display: inline-block;
    padding: 14px 25px;
    margin: 6px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.download {
    background: #f5c542;
    color: #080808;
}

.discord {
    background: #202020;
    color: white;
    border: 1px solid #444;
}

section {
    padding: 70px 8%;
    text-align: center;
}

section h2 {
    font-size: 32px;
    margin-bottom: 35px;
    color: #f5c542;
}

.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.card {
    background: #121212;
    border: 1px solid #292929;
    padding: 25px 15px;
    border-radius: 12px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #aaa;
    font-size: 14px;
}

.rules {
    max-width: 700px;
    margin: auto;
    text-align: left;
}

.rules p {
    background: #121212;
    padding: 15px;
    margin: 8px 0;
    border-radius: 8px;
    color: #ccc;
}

footer {
    background: #101010;
    padding: 25px;
    text-align: center;
    color: #777;
    border-top: 1px solid #292929;
}
